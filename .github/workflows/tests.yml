name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Installer
        run: uv sync --frozen --all-extras
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Typage
        run: uv run --frozen mypy
      - name: Tests
        run: uv run --frozen pytest --cov=zonefleet --cov-report=term-missing:skip-covered --cov-report=xml
