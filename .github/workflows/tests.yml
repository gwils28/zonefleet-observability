name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Installer
        run: uv sync --frozen --all-extras
      - name: Lint
        run: uv run --frozen ruff check .
      - name: Typage
        run: uv run --frozen mypy
      - name: Tests
        run: uv run --frozen pytest --cov=zonefleet --cov-report=term-missing:skip-covered --cov-report=xml

  reproductibilite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Installer
        run: uv sync --frozen --all-extras
      - name: Tables et graphiques interactifs régénérés depuis results/
        run: |
          uv run --frozen python scripts/make_tables.py
          uv run --frozen python scripts/make_interactive.py
      - name: Aucune différence avec le dépôt
        run: git diff --exit-code -- site/_tables site/_widgets
