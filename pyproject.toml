[project]
name = "zonefleet"
version = "0.6.0"
description = "Observabilité d'un forecaster de demande zone x heure (NYC TLC) : dérive, performance estimée sans labels, déclencheurs de réentraînement."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<2.3",
    "pyarrow>=16",
    "duckdb>=1.1",
    "lightgbm>=4.5",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "nannyml>=0.13",
    "statsforecast>=1.7",
    "holidays>=0.58",
    "pyyaml>=6",
    "matplotlib>=3.9",
    "requests>=2.32",
    "kaleido==0.2.1",  # dépendance de nannyml ; 0.2.1.post1 n a pas de roue x86_64
]

[project.scripts]
zonefleet = "zonefleet.cli:main"

[project.optional-dependencies]
ops = ["dagster>=1.9", "dagster-webserver>=1.9", "mlflow>=2.17"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
    "jupyter>=1.1",
    "nbformat>=5.10",
    "nbconvert>=7.16",
    "geopandas>=1.2.0",
    "tabulate>=0.10.0",
    "pre-commit>=4.7.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zonefleet"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
